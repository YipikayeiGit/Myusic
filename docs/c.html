<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>MUZIKA · Te han compartido música</title>
<meta property="og:title" content="Te han compartido música en MUZIKA">
<meta property="og:description" content="Ábrelo en MUZIKA para escucharlo.">
<meta property="og:image" content="https://yipikayeigit.github.io/Myusic/logo.png">
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg: #0d0b12; --panel: #17141f; --surface: #221d2d; --text: #f5f2fa; --text-sec: #a79fb6;
    --accent: #ff2e93; --violet: #7b3bff; --orange: #ffa62b;
    --brand: linear-gradient(120deg, var(--violet), var(--accent) 55%, var(--orange));
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header img { width: 34px; height: 34px; border-radius: 8px; }
  header b { letter-spacing: 2px; }
  .hero { background: linear-gradient(180deg, #3b1f5c, var(--panel)); border-radius: 16px; padding: 22px; text-align: center; }
  .cover { width: 220px; max-width: 70vw; aspect-ratio: 1; object-fit: cover; border-radius: 10px; box-shadow: 0 10px 40px #0008; background: var(--surface); display: block; margin: 0 auto 16px; }
  .kind { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--text-sec); }
  h1 { margin: 6px 0 4px; font-size: 26px; line-height: 1.15; word-break: break-word; }
  .sub { color: var(--text-sec); }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .btn { display: block; border: 0; border-radius: 999px; padding: 13px 22px; font: inherit; font-weight: 700; color: #fff; background: var(--brand); cursor: pointer; text-decoration: none; text-align: center; }
  .btn.ghost { background: transparent; border: 1px solid #ffffff44; }
  .muted { color: var(--text-sec); font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="logo.png" alt=""><b>MUZIKA</b></header>
  <div id="app"></div>
</div>
<script>
// Página pública de una canción o disco compartido desde MUZIKA. Todo viene en el enlace
// (#v=<canción>&t=<título>&a=<artista>… o #al=<disco>&…): no guarda ni consulta nada.
const frag = location.hash.slice(1);
const p = new URLSearchParams(frag);
const APK = 'https://github.com/YipikayeiGit/Myusic/releases/download/latest/Muzika.apk';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isSong = !!p.get('v'), isAlbum = !!p.get('al');
const title = p.get('t') || (isAlbum ? 'Disco' : 'Canción'), artist = p.get('a') || '';
const cover = /^https:\/\//.test(p.get('c') || '') ? p.get('c') : '';

function openApp() {
  if (/android/i.test(navigator.userAgent)) {
    location.href = `intent://c?${frag}#Intent;scheme=muzika;package=com.yipikayei.myusic;S.browser_fallback_url=${encodeURIComponent(APK)};end`;
  } else {
    location.href = `muzika://c?${frag}`;
  }
}

if (!isSong && !isAlbum) {
  document.getElementById('app').innerHTML = '<div class="hero"><h1>Enlace no válido</h1><div class="sub">Pide que te lo vuelvan a compartir.</div></div>';
} else {
  document.title = `${title}${artist ? ' · ' + artist : ''} · MUZIKA`;
  document.getElementById('app').innerHTML = `
    <div class="hero">
      ${cover ? `<img class="cover" src="${esc(cover)}" alt="">` : ''}
      <div class="kind">${isAlbum ? 'Disco' : 'Canción'} compartido contigo</div>
      <h1>${esc(title)}</h1>
      <div class="sub">${esc(artist)}</div>
      <div class="actions">
        <button class="btn" id="open">Abrir en MUZIKA</button>
        <a class="btn ghost" href="${APK}">Descargar MUZIKA (Android)</a>
      </div>
      <p class="muted">¿Usas MUZIKA en el PC? Copia este enlace y pégalo en el buscador.</p>
    </div>`;
  document.getElementById('open').onclick = openApp;
}
</script>
</body>
</html>
